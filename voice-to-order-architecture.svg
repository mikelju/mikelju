<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
  <style>
    .title{font:700 30px Arial,sans-serif;fill:#0f172a}.sub{font:400 17px Arial,sans-serif;fill:#64748b}.h{font:700 17px Arial,sans-serif;fill:#0f172a}.t{font:400 15px Arial,sans-serif;fill:#334155}.small{font:400 13px Arial,sans-serif;fill:#64748b}.box{stroke-width:2}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.loop{stroke:#3b82f6;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="520" fill="white"/>
<text x="60" y="54" class="title">Voice-to-Order</text>
<text x="60" y="84" class="sub">From a voice message to a confirmed order — with every confirmation improving future retrieval.</text>

<!-- sections -->
<rect x="40" y="125" width="220" height="300" rx="16" fill="#fff7ed" stroke="#fed7aa"/>
<rect x="280" y="125" width="300" height="300" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
<rect x="600" y="125" width="430" height="300" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
<rect x="1050" y="125" width="220" height="300" rx="16" fill="#fffbeb" stroke="#fde68a"/>
<rect x="1290" y="125" width="270" height="300" rx="16" fill="#ecfdf5" stroke="#a7f3d0"/>

<text x="65" y="160" class="h">1 · INPUT</text>
<text x="305" y="160" class="h">2 · UNDERSTANDING</text>
<text x="625" y="160" class="h">3 · RETRIEVAL</text>
<text x="1075" y="160" class="h">4 · VALIDATION</text>
<text x="1315" y="160" class="h">5 · ACTION + LEARNING</text>

<!-- input -->
<rect x="70" y="215" width="160" height="72" rx="12" class="box" fill="#ffedd5" stroke="#fb923c"/>
<text x="150" y="245" text-anchor="middle" class="h">Voice / Text</text>
<text x="150" y="269" text-anchor="middle" class="small">User request</text>
<text x="65" y="330" class="t">Natural language input</text>
<text x="65" y="352" class="small">No catalogue codes required.</text>

<!-- understanding -->
<rect x="315" y="195" width="230" height="76" rx="12" fill="#ddd6fe" stroke="#8b5cf6" class="box"/>
<text x="430" y="227" text-anchor="middle" class="h">Speech-to-Text</text>
<text x="430" y="250" text-anchor="middle" class="small">Voice → transcript</text>
<rect x="315" y="300" width="230" height="76" rx="12" fill="#ddd6fe" stroke="#8b5cf6" class="box"/>
<text x="430" y="332" text-anchor="middle" class="h">LLM Extraction</text>
<text x="430" y="355" text-anchor="middle" class="small">Products · quantities · refs</text>

<!-- retrieval -->
<rect x="635" y="200" width="160" height="78" rx="12" fill="#dbeafe" stroke="#60a5fa" class="box"/>
<text x="715" y="232" text-anchor="middle" class="h">Learned Memory</text>
<text x="715" y="255" text-anchor="middle" class="small">Past confirmed orders</text>
<rect x="635" y="310" width="160" height="78" rx="12" fill="#dbeafe" stroke="#60a5fa" class="box"/>
<text x="715" y="342" text-anchor="middle" class="h">Product Catalogue</text>
<text x="715" y="365" text-anchor="middle" class="small">Products & variants</text>
<rect x="840" y="250" width="150" height="78" rx="12" fill="#bfdbfe" stroke="#2563eb" class="box"/>
<text x="915" y="282" text-anchor="middle" class="h">Re-ranking</text>
<text x="915" y="305" text-anchor="middle" class="small">Best matches</text>

<!-- validation -->
<polygon points="1160,220 1220,275 1160,330 1100,275" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="1160" y="270" text-anchor="middle" class="h">User</text>
<text x="1160" y="290" text-anchor="middle" class="h">confirms?</text>

<!-- action -->
<rect x="1320" y="215" width="210" height="78" rx="12" fill="#d1fae5" stroke="#34d399" class="box"/>
<text x="1425" y="247" text-anchor="middle" class="h">Create confirmed order</text>
<text x="1425" y="270" text-anchor="middle" class="small">ERP / API / business system</text>
<rect x="1320" y="325" width="210" height="62" rx="12" fill="#dbeafe" stroke="#60a5fa" class="box"/>
<text x="1425" y="352" text-anchor="middle" class="h">Update memory</text>
<text x="1425" y="373" text-anchor="middle" class="small">Confirmed mapping</text>

<!-- arrows -->
<path d="M230 251 H315" class="line"/>
<path d="M430 271 V300" class="line"/>
<path d="M545 338 H600" class="line"/>
<path d="M600 338 H620 V239 H635" class="line"/>
<path d="M620 338 V349 H635" class="line"/>
<path d="M795 239 H820 V289 H840" class="line"/>
<path d="M795 349 H820 V289 H840" class="line"/>
<path d="M990 289 H1100" class="line"/>
<path d="M1220 275 H1320" class="line"/>
<path d="M1425 293 V325" class="line"/>

<!-- learning loop -->
<path d="M1425 387 C1425 455 920 475 430 455 C395 453 395 410 430 376" class="loop"/>
<text x="930" y="468" text-anchor="middle" class="t">Confirmed orders feed the memory → future matches improve</text>
</svg>